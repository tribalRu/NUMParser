<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width">
    <link rel="icon" href="./img/favicon.ico">

    <title>Настройки numParser</title>

    <link rel="preload" href="https://fonts.googleapis.com/css?family=Rubik:300,400&display=auto" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Rubik:300,400&display=auto">
    <link rel="stylesheet" type="text/css" href="./css/icheck-material.css?v=5">
    <link rel="stylesheet" type="text/css" href="./css/styles.css?v=16" />
</head>

<body>
<div id="page" class="settings-page">
    <div class="topbar">
        <a class="nav-button" href="/">На главную</a>
    </div>

    <div id="settingsPanel">
        <h2>Настройки</h2>

        <form id="settingsForm">
            <div class="settings-grid">
                <label class="settings-field">
                    <span>Rutor host</span>
                    <input name="host" type="url" placeholder="http://rutor.info" required>
                </label>

                <label class="settings-field">
                    <span>Порт веб-интерфейса</span>
                    <input name="port" type="number" min="1" max="65535" required>
                </label>

                <label class="settings-field settings-field-wide">
                    <span>Прокси</span>
                    <input name="proxy" type="url" placeholder="http://user:password@ip:port">
                </label>

                <label class="settings-check settings-field-wide">
                    <input name="useproxy" type="checkbox">
                    <span>Использовать автоматический список прокси</span>
                </label>

                <label class="settings-field settings-field-wide">
                    <span>TMDB token</span>
                    <input name="tmdbtoken" type="password" autocomplete="off">
                </label>

                <label class="settings-field settings-field-wide">
                    <span>Google AI Studio key</span>
                    <input name="aigkey" type="password" autocomplete="off">
                </label>

                <label class="settings-field settings-field-wide">
                    <span>Groq API key (резервная/альтернативная нейросеть, бесплатно на console.groq.com)</span>
                    <input name="groqkey" type="password" autocomplete="off" placeholder="gsk_...">
                </label>

                <label class="settings-field">
                    <span>Модель Groq</span>
                    <select name="groqmodel">
                        <option value="qwen/qwen3.8-27b">qwen/qwen3.8-27b (Рекомендуется)</option>
                        <option value="openai/gpt-oss-120b">openai/gpt-oss-120b (Большая)</option>
                        <option value="openai/gpt-oss-20b">openai/gpt-oss-20b (Быстрая)</option>
                    </select>
                </label>

                <label class="settings-field settings-field-wide">
                    <span>OpenRouter API key (бесплатные модели на openrouter.ai)</span>
                    <input name="openrouterkey" type="password" autocomplete="off" placeholder="sk-or-v1-...">
                </label>

                <label class="settings-field">
                    <span>Модель OpenRouter</span>
                    <select name="openroutermodel">
                        <option value="google/gemma-4-31b-it:free">google/gemma-4-31b-it:free (Рекомендуется)</option>
                        <option value="google/gemma-4-26b-a4b-it:free">google/gemma-4-26b-a4b-it:free (Быстрая)</option>
                        <option value="nvidia/nemotron-3.5-lightning:free">nvidia/nemotron-3.5-lightning:free (Nemotron 3.5)</option>
                        <option value="inclusionai/ling-3.2-flash:free">inclusionai/ling-3.2-flash:free (Ling 3.2)</option>
                    </select>
                </label>

                <div class="settings-field settings-field-wide" style="display: flex; align-items: center; gap: 15px; margin-top: 5px;">
                    <button type="button" id="btnGenColls" class="settings-button" style="background: #2a5298; border: none; padding: 8px 16px; border-radius: 4px; color: #fff; cursor: pointer; font-size: 0.95rem;">
                        ⚡ Перегенерировать ИИ-подборки сейчас
                    </button>
                    <span id="genCollsStatus" style="font-size: 0.9rem; color: #bbb;"></span>
                </div>

                <div class="settings-field-wide" style="margin-top: 15px; margin-bottom: 5px; border-top: 1px solid #444; padding-top: 15px;">
                    <h3 style="color: #fff; margin: 0 0 10px 0; font-size: 1.1rem;">Наполнение релизов для NUM</h3>
                </div>

                <label class="settings-field">
                    <span>Сортировка фильмов</span>
                    <select name="movie_sort">
                        <option value="release_date">По дате премьеры (TMDB)</option>
                        <option value="tracker">По дате на трекере</option>
                    </select>
                </label>

                <label class="settings-field">
                    <span>Макс. возраст фильмов (мес, 0 = без отсечения)</span>
                    <input name="movie_max_age_months" type="number" min="0" max="120" placeholder="6">
                </label>

                <label class="settings-field">
                    <span>Сортировка сериалов</span>
                    <select name="tv_sort">
                        <option value="last_air_date">По свежести серии (TMDB)</option>
                        <option value="tracker">По дате на трекере</option>
                    </select>
                </label>

                <label class="settings-field">
                    <span>Макс. возраст серии (мес, 0 = без отсечения)</span>
                    <input name="tv_max_age_months" type="number" min="0" max="120" placeholder="6">
                </label>

                <label class="settings-field">
                    <span>Сортировка аниме</span>
                    <select name="anime_sort">
                        <option value="last_air_date">По свежести серии (TMDB)</option>
                        <option value="tracker">По дате на трекере</option>
                    </select>
                </label>

                <label class="settings-field">
                    <span>Макс. возраст аниме (мес, 0 = без отсечения)</span>
                    <input name="anime_max_age_months" type="number" min="0" max="120" placeholder="6">
                </label>

                <div class="settings-field-wide" style="margin-top: 15px; margin-bottom: 5px; border-top: 1px solid #444; padding-top: 15px;">
                    <h3 style="color: #fff; margin: 0 0 10px 0; font-size: 1.1rem;">Фильтрация коллекций по рейтингу</h3>
                </div>

                <label class="settings-field">
                    <span>Мин. рейтинг для коллекций (0.0 = без фильтра)</span>
                    <input name="colls_min_rating" type="number" step="0.1" min="0" max="10" placeholder="6.0">
                </label>

                <label class="settings-field">
                    <span>Мин. оценок для строгого учета (порог новинки)</span>
                    <input name="colls_min_votes" type="number" min="0" max="100000" placeholder="30">
                </label>

                <label class="settings-field">
                    <span>Срок новинки проката (мес, льгота новинок)</span>
                    <input name="colls_fresh_months" type="number" min="0" max="120" placeholder="18">
                </label>

                <div class="settings-field-wide" style="margin-top: 15px; margin-bottom: 5px; border-top: 1px solid #444; padding-top: 15px;">
                    <h3 style="color: #fff; margin: 0 0 10px 0; font-size: 1.1rem;">Локальная база IMDb (tribalRu/imdb-db)</h3>
                </div>

                <label class="settings-check settings-field-wide">
                    <input name="imdb_enabled" type="checkbox">
                    <span>Включить использование локальной базы IMDb (более объективные оценки и метаданные)</span>
                </label>

                <label class="settings-field">
                    <span>URL сервиса imdb-db</span>
                    <input name="imdb_host" type="text" placeholder="http://192.168.1.73:8000">
                </label>

                <label class="settings-field">
                    <span>Секретный токен Bearer (если настроен)</span>
                    <input name="imdb_token" type="password" autocomplete="off" placeholder="Оставьте пустым, если токен не нужен">
                </label>

                <label class="settings-check settings-field-wide">
                    <input name="imdb_prefer_rating" type="checkbox">
                    <span>Приоритет рейтинга IMDb перед TMDB (отображать и фильтровать по оценкам IMDb)</span>
                </label>

                <div class="settings-field-wide" style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
                    <button type="button" class="secondary-button" id="btnTestImdb">Проверить подключение к IMDb</button>
                    <span id="imdbStatus" style="font-size: 0.9rem;"></span>
                </div>

                <div class="settings-field-wide" style="margin-top: 15px; margin-bottom: 5px; border-top: 1px solid #444; padding-top: 15px;">
                    <h3 style="color: #fff; margin: 0 0 10px 0; font-size: 1.1rem;">Безопасность раздела настроек</h3>
                </div>

                <label class="settings-check settings-field-wide">
                    <input name="enable_settings" type="checkbox">
                    <span>Разрешить доступ к веб-настройкам (снимите галочку для полного отключения на публичных серверах)</span>
                </label>

                <label class="settings-field">
                    <span>Пароль администратора (логин: admin)</span>
                    <input name="admin_password" type="password" autocomplete="off" placeholder="Оставьте пустым для отключения">
                </label>

                <label class="settings-field">
                    <span>Секретный ключ (вход по ссылке ?key=...)</span>
                    <input name="access_key" type="text" autocomplete="off" placeholder="Секретный ключ">
                </label>
            </div>

            <div class="settings-actions">
                <button type="submit" class="primary-button">Сохранить</button>
                <button type="button" class="secondary-button" id="reloadSettings">Отменить</button>
            </div>

            <div id="settingsMessage" class="settings-message"></div>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById('settingsForm')
    const message = document.getElementById('settingsMessage')
    const reloadButton = document.getElementById('reloadSettings')

    function showMessage(text, type) {
        message.textContent = text
        message.className = 'settings-message ' + (type || '')
    }

    function setFormDisabled(disabled) {
        Array.from(form.elements).forEach(function(element) {
            element.disabled = disabled
        })
    }

    function fillForm(settings) {
        form.elements.host.value = settings.host || ''
        form.elements.port.value = settings.port || ''
        form.elements.proxy.value = settings.proxy || ''
        form.elements.useproxy.checked = Boolean(settings.useproxy)
        form.elements.tmdbtoken.value = settings.tmdbtoken || ''
        form.elements.aigkey.value = settings.aigkey || ''
        form.elements.groqkey.value = settings.groqkey || ''
        form.elements.groqmodel.value = settings.groqmodel || 'llama-3.3-70b-versatile'
        form.elements.openrouterkey.value = settings.openrouterkey || ''
        form.elements.openroutermodel.value = settings.openroutermodel || 'google/gemini-2.0-flash-exp:free'

        const rel = settings.releases || {}
        form.elements.movie_sort.value = rel.movie_sort || 'release_date'
        form.elements.movie_max_age_months.value = (rel.movie_max_age_months !== undefined) ? rel.movie_max_age_months : 6
        form.elements.tv_sort.value = rel.tv_sort || 'last_air_date'
        form.elements.tv_max_age_months.value = (rel.tv_max_age_months !== undefined) ? rel.tv_max_age_months : 6
        form.elements.anime_sort.value = rel.anime_sort || 'last_air_date'
        form.elements.anime_max_age_months.value = (rel.anime_max_age_months !== undefined) ? rel.anime_max_age_months : 6
        form.elements.colls_min_rating.value = (rel.colls_min_rating !== undefined) ? rel.colls_min_rating : 6.0
        form.elements.colls_min_votes.value = (rel.colls_min_votes !== undefined) ? rel.colls_min_votes : 30
        form.elements.colls_fresh_months.value = (rel.colls_fresh_months !== undefined) ? rel.colls_fresh_months : 18

        const imdbCfg = settings.imdb || {}
        form.elements.imdb_enabled.checked = (imdbCfg.enabled !== undefined) ? Boolean(imdbCfg.enabled) : true
        form.elements.imdb_host.value = imdbCfg.host || 'http://192.168.1.73:8000'
        form.elements.imdb_token.value = imdbCfg.token || ''
        form.elements.imdb_prefer_rating.checked = (imdbCfg.prefer_imdb_rating !== undefined) ? Boolean(imdbCfg.prefer_imdb_rating) : true

        const sec = settings.security || {}
        form.elements.enable_settings.checked = (sec.enable_settings !== undefined) ? Boolean(sec.enable_settings) : true
        form.elements.admin_password.value = sec.admin_password || ''
        form.elements.access_key.value = sec.access_key || ''
    }

    const urlParams = new URLSearchParams(window.location.search);
    const accessKeyParam = urlParams.get('key') || '';

    function apiUrl(path) {
        if (!accessKeyParam) return path;
        const sep = path.includes('?') ? '&' : '?';
        return path + sep + 'key=' + encodeURIComponent(accessKeyParam);
    }

    function collectSettings() {
        return {
            host: form.elements.host.value.trim(),
            port: form.elements.port.value.trim(),
            proxy: form.elements.proxy.value.trim(),
            useproxy: form.elements.useproxy.checked,
            tmdbtoken: form.elements.tmdbtoken.value.trim(),
            aigkey: form.elements.aigkey.value.trim(),
            groqkey: form.elements.groqkey.value.trim(),
            groqmodel: form.elements.groqmodel.value.trim(),
            openrouterkey: form.elements.openrouterkey.value.trim(),
            openroutermodel: form.elements.openroutermodel.value.trim(),
            releases: {
                movie_sort: form.elements.movie_sort.value,
                movie_max_age_months: parseInt(form.elements.movie_max_age_months.value, 10) || 0,
                tv_sort: form.elements.tv_sort.value,
                tv_max_age_months: parseInt(form.elements.tv_max_age_months.value, 10) || 0,
                anime_sort: form.elements.anime_sort.value,
                anime_max_age_months: parseInt(form.elements.anime_max_age_months.value, 10) || 0,
                colls_min_rating: parseFloat(form.elements.colls_min_rating.value) || 0.0,
                colls_min_votes: parseInt(form.elements.colls_min_votes.value, 10) || 0,
                colls_fresh_months: parseInt(form.elements.colls_fresh_months.value, 10) || 0
            },
            imdb: {
                enabled: form.elements.imdb_enabled.checked,
                host: form.elements.imdb_host.value.trim(),
                token: form.elements.imdb_token.value.trim(),
                prefer_imdb_rating: form.elements.imdb_prefer_rating.checked
            },
            security: {
                enable_settings: form.elements.enable_settings.checked,
                admin_password: form.elements.admin_password.value.trim(),
                access_key: form.elements.access_key.value.trim()
            }
        }
    }

    async function loadSettings() {
        setFormDisabled(true)
        showMessage('Загрузка...', '')
        try {
            const response = await fetch(apiUrl('/api/settings'))
            const data = await response.json()
            if (!response.ok) {
                throw new Error(data.error || 'Не удалось загрузить настройки')
            }
            fillForm(data.settings)
            showMessage('', '')
        } catch (error) {
            showMessage(error.message, 'error')
        } finally {
            setFormDisabled(false)
        }
    }

    form.addEventListener('submit', async function(event) {
        event.preventDefault()
        setFormDisabled(true)
        showMessage('Сохранение...', '')
        try {
            const response = await fetch(apiUrl('/api/settings'), {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Access-Key': accessKeyParam
                },
                body: JSON.stringify(collectSettings())
            })
            const data = await response.json()
            if (!response.ok) {
                throw new Error(data.error || 'Не удалось сохранить настройки')
            }
            fillForm(data.settings)
            if (data.restart_required) {
                showMessage('Сохранено. Новый порт применится после перезапуска numParser.', 'warning')
            } else {
                showMessage('Сохранено.', 'success')
            }
        } catch (error) {
            showMessage(error.message, 'error')
        } finally {
            setFormDisabled(false)
        }
    })

    const btnGenColls = document.getElementById('btnGenColls')
    const genCollsStatus = document.getElementById('genCollsStatus')
    if (btnGenColls && genCollsStatus) {
        btnGenColls.addEventListener('click', async function() {
            btnGenColls.disabled = true
            genCollsStatus.style.color = '#bbb'
            genCollsStatus.textContent = 'Запуск генерации...'
            try {
                const response = await fetch(apiUrl('/api/collections/generate'), {
                    method: 'POST',
                    headers: { 'X-Access-Key': accessKeyParam }
                })
                const data = await response.json()
                if (response.status === 409 || data.status === 'busy') {
                    genCollsStatus.style.color = '#ffa726'
                    genCollsStatus.textContent = data.message || 'Генерация уже выполняется в фоновом режиме.'
                } else if (response.ok) {
                    genCollsStatus.style.color = '#4caf50'
                    genCollsStatus.textContent = data.message || 'Генерация запущена! Следите за логами сервера.'
                } else {
                    genCollsStatus.style.color = '#f44336'
                    genCollsStatus.textContent = data.message || data.error || 'Ошибка запуска'
                }
            } catch (err) {
                genCollsStatus.style.color = '#f44336'
                genCollsStatus.textContent = 'Ошибка сети: ' + err.message
            } finally {
                setTimeout(() => { btnGenColls.disabled = false }, 5000)
            }
        })
    }

    const btnTestImdb = document.getElementById('btnTestImdb')
    const imdbStatus = document.getElementById('imdbStatus')
    if (btnTestImdb && imdbStatus) {
        btnTestImdb.addEventListener('click', async function() {
            btnTestImdb.disabled = true
            imdbStatus.style.color = '#bbb'
            imdbStatus.textContent = 'Проверка...'
            try {
                const response = await fetch(apiUrl('/api/imdb/test'))
                const data = await response.json()
                if (data.status === 'ok') {
                    imdbStatus.style.color = '#4caf50'
                    imdbStatus.textContent = data.message || 'Соединение успешно!'
                } else {
                    imdbStatus.style.color = '#f44336'
                    imdbStatus.textContent = data.message || 'Ошибка соединения'
                }
            } catch (err) {
                imdbStatus.style.color = '#f44336'
                imdbStatus.textContent = 'Ошибка сети: ' + err.message
            } finally {
                btnTestImdb.disabled = false
            }
        })
    }

    reloadButton.addEventListener('click', loadSettings)
    loadSettings()
</script>
</body>
</html>
