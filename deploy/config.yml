# ==============================================================================
# ОБЩИЕ НАСТРОЙКИ СЕРВЕРА
# ==============================================================================

# Зеркало / адрес трекера Rutor
host: http://rutor.is

# Порт встроенного веб-интерфейса и раздачи релизов (по умолчанию: 38888)
port: 30000

# Использовать автоматический список прокси (скрипт proxy.sh / proxy.bat)
useproxy: false

# Статический HTTP или SOCKS5 прокси (например: http://user:password@ip:port или socks5://ip:port)
proxy: ""

# TMDB API Read Access Token v4 (начинается с eyJ... или Bearer eyJ...)
# Необходим для сопоставления раздач с TMDB, получения постеров, описаний, жанров и дат релизов
tmdbtoken: ""

# Ключ Google AI Studio API для автоматической генерации коллекций фильмов нейросетью (основной)
aigkey: ""

# Ключ Groq API (резервный ИИ при сбоях или исчерпании квоты Google, бесплатно на console.groq.com)
groqkey: ""

# Модель Groq (по умолчанию: qwen/qwen3.8-27b, также доступны: openai/gpt-oss-120b, openai/gpt-oss-20b)
groqmodel: 'qwen/qwen3.8-27b'

# Ключ OpenRouter API (бесплатные модели на openrouter.ai)
openrouterkey: ''

# Модель OpenRouter (по умолчанию: google/gemma-4-31b-it:free)
# Другие бесплатные модели: google/gemma-4-26b-a4b-it:free, nvidia/nemotron-3.5-lightning:free, meta-llama/llama-3.2-3b-instruct:free
openroutermodel: 'google/gemma-4-31b-it:free'

# ==============================================================================
# БЕЗОПАСНОСТЬ И ДОСТУП К ВЕБ-НАСТРОЙКАМ
# ==============================================================================
security:
  # Включить веб-интерфейс настроек (/settings).
  # Если false — раздел настроек полностью отключен и возвращает 404.
  # Рекомендуется ставить false для публичных серверов / VPS вне домашней сети,
  # где конфигурация задается напрямую через файл config.yml:
  enable_settings: true

  # Пароль администратора для входа в раздел /settings (логин: admin).
  # Оставьте пустым (""), если пароль не требуется:
  admin_password: ""

  # Секретный ключ доступа для быстрого входа по прямой ссылке.
  # Например, если задан "mysecret", вы сможете открывать настройки по ссылке:
  #   http://<ip-сервера>:30000/settings?key=mysecret
  # Оставьте пустым (""), если ключ не требуется:
  access_key: ""

# ==============================================================================
# ИНТЕГРАЦИЯ С ЛОКАЛЬНОЙ БАЗОЙ IMDB (tribalRu/imdb-db)
# ==============================================================================
imdb:
  # Включить использование локальной базы IMDb для фильтрации и обогащения метаданных:
  enabled: true

  # URL сервиса imdb-db (FastAPI бэкенд):
  host: "http://192.168.1.73:8000"

  # Секретный токен Bearer (оставьте пустым "", если API_TOKEN в imdb-db не задан):
  token: ""

  # Таймаут запросов к сервису imdb-db (в секундах, для локальной сети достаточно 1 сек):
  timeout_sec: 1

  # Приоритет IMDb: использовать более объективный рейтинг IMDb вместо TMDB:
  prefer_imdb_rating: true

# ==============================================================================
# НАСТРОЙКИ НАПОЛНЕНИЯ РЕЛИЗОВ ДЛЯ ПРИЛОЖЕНИЯ NUM
# ==============================================================================
releases:
  # ----------------------------------------------------------------------------
  # Единая фильтрация по рейтингу (фильмы, 4K, сериалы, аниме, мультфильмы, коллекции и по годам)
  # ----------------------------------------------------------------------------
  # Единый минимальный рейтинг материала (IMDb / TMDB) для всех разделов (от 0.0 до 10.0).
  # Например, 6.0 — отсекает низкорейтинговый проходной треш (0.0 — отключить фильтр):
  min_rating: 6.0

  # Порог минимального количества оценок для строгого учета рейтинга.
  # Если у материала меньше оценок, чем указано (или 0), и он вышел недавно,
  # он НЕ отсекается по рейтингу, чтобы не потерять свежие новинки проката и эфира:
  min_votes: 30

  # Срок новинки (в месяцах от даты премьеры), в течение которого материал считается
  # новинкой и получает льготный пропуск при малом числе оценок или их отсутствии:
  fresh_months: 18
  # ----------------------------------------------------------------------------
  # Фильмы, 4K и полнометражные мультфильмы (movies_id.json, 4k_id.json, cartoons_id.json)
  # ----------------------------------------------------------------------------
  # Режим сортировки фильмов:
  #   "release_date" - по реальной дате мировой/цифровой премьеры из TMDB (новинки сверху)
  #   "tracker"      - по дате добавления/перезалива раздачи на трекер (старое поведение)
  movie_sort: "release_date"

  # Максимальный возраст фильма со дня премьеры для раздела "Новинки" (в месяцах).
  # Например, 6 — в новинки попадут только фильмы за последние полгода от даты релиза.
  # Старые фильмы и ремастеры прошлых лет будут отсеяны (0 — отключить фильтр по возрасту):
  movie_max_age_months: 6

  # ----------------------------------------------------------------------------
  # Сериалы и мультсериалы (tv_id.json, cartoons_tv_id.json)
  # ----------------------------------------------------------------------------
  # Режим сортировки сериалов:
  #   "last_air_date" - по дате выхода последней вышедшей серии из TMDB (свежие серии сверху)
  #   "tracker"       - по дате появления новой раздачи на трекере
  tv_sort: "last_air_date"

  # Максимальный возраст последней серии (в месяцах) для отсечения перезаливов старых сериалов.
  # Например, 6 — сериалы, у которых последняя серия вышла более полугода назад, не попадут в новинки.
  # Новые сезоны сериалов прошлых лет при этом остаются в топе (0 — отключить фильтр):
  tv_max_age_months: 6

  # ----------------------------------------------------------------------------
  # Аниме (anime_id.json)
  # ----------------------------------------------------------------------------
  # Режим сортировки аниме:
  #   "last_air_date" - по дате выхода свежего эпизода (онгоинги текущего сезона сверху)
  #   "tracker"       - по дате раздачи на трекере
  anime_sort: "last_air_date"

  # Максимальный возраст последнего эпизода аниме (в месяцах):
  anime_max_age_months: 6
