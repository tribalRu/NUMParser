# ==============================================================================
# БЕЗОПАСНОСТЬ И ДОСТУП К ВЕБ-НАСТРОЙКАМ
# ==============================================================================
security:
  # Включить веб-интерфейс настроек (/settings).
  # Если false — раздел настроек полностью отключен и возвращает 404.
  # Рекомендуется ставить false для публичных серверов / VPS вне домашней сети,
  # где конфигурация задается напрямую через файл config.yml:
  enable_settings: true

  # Пароль администратора для входа в раздел /settings (логин: admin).
  # Оставьте пустым (""), если пароль не требуется:
  admin_password: ""

  # Секретный ключ доступа для быстрого входа по прямой ссылке.
  # Например, если задан "mysecret", вы сможете открывать настройки по ссылке:
  #   http://<ip-сервера>:30000/settings?key=mysecret
  # Оставьте пустым (""), если ключ не требуется:
  access_key: ""

# ==============================================================================
# НАСТРОЙКИ НАПОЛНЕНИЯ РЕЛИЗОВ ДЛЯ ПРИЛОЖЕНИЯ NUM
# ==============================================================================
releases:
  # ----------------------------------------------------------------------------
  # Фильмы, 4K и полнометражные мультфильмы (movies_id.json, 4k_id.json, cartoons_id.json)
  # ----------------------------------------------------------------------------
  # Режим сортировки фильмов:
  #   "release_date" - по реальной дате мировой/цифровой премьеры из TMDB (новинки сверху)
  #   "tracker"      - по дате добавления/перезалива раздачи на трекер (старое поведение)
  movie_sort: "release_date"

  # Максимальный возраст фильма со дня премьеры для раздела "Новинки" (в месяцах).
  # Например, 6 — в новинки попадут только фильмы за последние полгода от даты релиза.
  # Старые фильмы и ремастеры прошлых лет будут отсеяны (0 — отключить фильтр по возрасту):
  movie_max_age_months: 6

  # ----------------------------------------------------------------------------
  # Сериалы и мультсериалы (tv_id.json, cartoons_tv_id.json)
  # ----------------------------------------------------------------------------
  # Режим сортировки сериалов:
  #   "last_air_date" - по дате выхода последней вышедшей серии из TMDB (свежие серии сверху)
  #   "tracker"       - по дате появления новой раздачи на трекере
  tv_sort: "last_air_date"

  # Максимальный возраст последней серии (в месяцах) для отсечения перезаливов старых сериалов.
  # Например, 6 — сериалы, у которых последняя серия вышла более полугода назад, не попадут в новинки.
  # Новые сезоны сериалов прошлых лет при этом остаются в топе (0 — отключить фильтр):
  tv_max_age_months: 6

  # ----------------------------------------------------------------------------
  # Аниме (anime_id.json)
  # ----------------------------------------------------------------------------
  # Режим сортировки аниме:
  #   "last_air_date" - по дате выхода свежего эпизода (онгоинги текущего сезона сверху)
  #   "tracker"       - по дате раздачи на трекере
  anime_sort: "last_air_date"

  # Максимальный возраст последнего эпизода аниме (в месяцах):
  anime_max_age_months: 6
